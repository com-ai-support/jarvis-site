<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS 商品検索システム</title>
</head>
<body>
  <h1>JARVIS 商品検索システム</h1>

  <p>
    JARVISは、オンラインショップの商品情報・価格情報を取得し、
    仕入候補商品の検索、価格比較および利益分析を行うためのシステムです。
  </p>

  <h2>主な用途</h2>
  <ul>
    <li>商品情報の検索</li>
    <li>価格情報の比較</li>
    <li>仕入候補商品の分析</li>
    <li>利益・利益率・ROIの計算</li>
  </ul>

  <p>現在開発中です。</p>
</body>
</html>
